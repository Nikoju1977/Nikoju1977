<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">STUDIO NIKO DESIGN — Cinéma, code et expériences humaines</title>
  <desc id="d">Signature graphique : un cadre de cinéma et des orbites numériques lumineux sur fond bleu nuit, accompagnés de la devise Des histoires qui deviennent des outils.</desc>
  <defs>
