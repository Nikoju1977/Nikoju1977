name: Studio Niko Precision Core quality
on:
  push:
    paths:
      - 'studio-niko-core/precision/**'
      - '.github/workflows/precision-core.yml'
  pull_request:
    paths:
      - 'studio-niko-core/precision/**'
      - '.github/workflows/precision-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node studio-niko-core/precision/v1.1.0/verify.mjs
      - run: node --check studio-niko-core/precision/v1.1.0/niko-precision-core.mjs
      - run: node --test studio-niko-core/precision/v1.1.0/*.test.mjs
