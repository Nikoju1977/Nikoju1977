name: MEDGUARD V3 — tests techniques (non cliniques)
on:
  push:
    paths:
      - 'projects/medguard-clinique-v3/**'
      - '.github/workflows/medguard-v3-ci.yml'
  pull_request:
    paths:
      - 'projects/medguard-clinique-v3/**'
      - '.github/workflows/medguard-v3-ci.yml'
permissions:
  contents: read
jobs:
  tests:
    name: Python et JavaScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/medguard-clinique-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q backend
      - run: node --test tests/engine.test.js
      - run: node --check web/app.js
      - run: node --check web/engine.js
      - run: python tools/build_standalone.py
