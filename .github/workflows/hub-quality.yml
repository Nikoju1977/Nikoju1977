name: Studio Niko Hub · Qualité et accès

on:
  push:
    paths:
      - "hub/**"
      - ".github/workflows/hub-quality.yml"
  pull_request:
    paths:
      - "hub/**"
      - ".github/workflows/hub-quality.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  validate-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --version
          node --check hub/app.js
          node --check hub/sw.js
          node --check hub/api/health.js
          node --check hub/audit-links.cjs
          node --check hub/check.cjs
      - name: Verify catalog, privacy and DOM bindings
        run: node hub/check.cjs
      - name: Weekly or manual HTTP audit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node hub/audit-links.cjs
