name: Studio Niko Hub · Qualité et accès

on:
  push:
    paths:
      - "hub/**"
      - "studio-niko-core/registry.json"
      - ".github/workflows/hub-quality.yml"
  pull_request:
    paths:
      - "hub/**"
      - "studio-niko-core/registry.json"
      - ".github/workflows/hub-quality.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  validate-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --version
          node --check hub/app.js
          node --check hub/sw.js
          node --check hub/api/health.js
          node --check hub/audit-links.cjs
          node --check hub/check.cjs
          node --check hub/evidence.cjs
          node --check hub/quality-core.js
          node --check hub/quality.js
          node --check hub/deployments-core.js
          node --check hub/deployments.js
          node --check hub/security-core.js
          node --check hub/security.js
          node --check hub/security-audit.cjs
          node --check hub/agents-core.js
          node --check hub/agents.js
          node --check hub/devices-core.js
          node --check hub/devices.js
      - name: Verify catalog, privacy and DOM bindings
        run: node hub/check.cjs
      - name: Evidence regression tests
        run: node --test hub/evidence.test.cjs hub/quality.test.cjs hub/deployments.test.cjs hub/security.test.cjs hub/agents.test.cjs hub/devices.test.cjs
      - name: Weekly or manual HTTP audit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node hub/audit-links.cjs
